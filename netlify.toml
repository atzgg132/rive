[build]
  command = "npm run build:netlify"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Public configuration constants, not credentials. Keep real secret scanning on.
  SECRETS_SCAN_OMIT_KEYS = "APP_ENV,APP_URL,ASSET_BUCKET,ASSET_STORAGE_PROVIDER,MAX_UPLOAD_BYTES,EMAIL_PROVIDER,EMAIL_FROM,EMAIL_REPLY_TO,MAX_MEDIA_UPLOAD_BYTES,SMTP_HOST,SMTP_USER,SMTP_PORT,SMTP_SECURE,ZOHO_ACCOUNTS_URL,ZOHO_BOOKS_CLIENT_ID,GOOGLE_CALENDAR_CLIENT_ID,ADMIN_USERNAME,ESIGN_PROVIDER,HOSTING_PROVIDER,S3_REGION,S3_ENDPOINT,MIGRATION_QUEUE_PROVIDER,NETLIFY_SITE_URL,NODE_VERSION,NEXT_TELEMETRY_DISABLED"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "@prisma/adapter-pg", "pg"]
  included_files = ["node_modules/.prisma/client/**"]

[functions.job-dispatch]
  schedule = "* * * * *"

[context.deploy-preview.environment]
  NETLIFY_SCHEDULES_ENABLED = "false"

[context.branch-deploy.environment]
  NETLIFY_SCHEDULES_ENABLED = "false"
