name: Deploy to AWS

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rive
          POSTGRES_PASSWORD: rive
          POSTGRES_DB: rive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rive -d rive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rive:rive@localhost:5432/rive_test
      DATABASE_SSL: disable
      SESSION_SECRET: ci-session-secret
      CALENDAR_ENCRYPTION_KEY: ci-calendar-encryption-key
      CRON_SECRET: ci-cron-secret
      APP_URL: http://127.0.0.1:3000
      APP_ENV: test
      EMAIL_PROVIDER: ses
      AWS_REGION: ap-south-1
      ESIGN_PROVIDER: local
      CONTRACTS_ALLOW_LOCAL_PROVIDER_IN_PRODUCTION: "true"
      CONTRACTS_RECORDED_ACCEPTANCE_ENABLED: "true"
      E2E_USER_EMAIL: e2e-workspace@rive.test
      # Test-only admin credentials for the ephemeral CI database and CI app process.
      # They are not used by, and have no meaning in, any deployed environment: the
      # real values come from the deploy environment's own secrets.
      ADMIN_USERNAME: e2e-admin
      ADMIN_PASSWORD_HASH: scrypt:865ae7913b63f7f5bdc6235e489624e6:04e880f8bbb611921db676efec9d960dc29efea47fd1f9aca23f62410a08d4b8bee80458cf9273511e57a10a77df376a72e55cf037f6b216cc301951ac16155d
      E2E_ADMIN_PASSWORD: e2e-admin-not-a-real-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: node scripts/seed-e2e-user.mjs
      - run: npm run test:unit
      - run: npx tsc --noEmit --incremental false
      - run: npm run lint
      # dev is the only pre-production gate now that test is retired, so it runs
      # the same browser suite as main rather than deploying less-verified code.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run E2E tests
        env:
          PLAYWRIGHT_SERVER: production
          PLAYWRIGHT_WORKERS: 4
        run: npm run test:e2e
      - run: npm audit --omit=dev

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - name: Build and push application image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.ref_name == 'main' && 'prod' || github.ref_name }}-${{ github.sha }}
          build-args: DEPLOYMENT_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          platforms: linux/arm64
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.ref_name == 'main' && 'prod' || github.ref_name }}-${{ github.sha }}-migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy immutable image through Systems Manager
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
          IMAGE_TAG: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}-${{ github.sha }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters commands="docker image prune -af >/dev/null 2>&1 || true; /opt/rive/deploy.sh $ENVIRONMENT $IMAGE_TAG" \
            --query Command.CommandId \
            --output text)
          set +e
          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"
          wait_status=$?
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          exit "$wait_status"
