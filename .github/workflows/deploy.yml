name: Release verification

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Netlify builds the connected branches. Promotion still requires reading
  # the work-branch Quality run and checking the isolated dev deployment.
  # There is deliberately no AWS deployment or credential assumption here.
  verify:
    uses: ./.github/workflows/verify.yml
