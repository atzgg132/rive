name: Deploy to AWS

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The same suite pull requests run. A squash commit whose tree its PR already
  # verified (or a dev -> main promotion of a verified dev tree) passes through
  # instantly; anything else runs in full before it can deploy.
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - name: Build and push application image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.ref_name == 'main' && 'prod' || github.ref_name }}-${{ github.sha }}
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
            APP_URL=${{ github.ref_name == 'main' && 'https://www.rive.work' || 'https://dev.rive.work' }}
          # No gha cache export: mode=max spent ~2.5 min uploading every
          # intermediate layer and never hit, because both image builds shared
          # one cache scope and overwrote each other. Dependency layers rebuild
          # in parallel in ~30 s; the migration image reuses this builder's
          # local layers within the job.
      - name: Build and push migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          platforms: linux/arm64
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.ref_name == 'main' && 'prod' || github.ref_name }}-${{ github.sha }}-migrate
      # The runner ships the repo's deploy script and canonical Caddyfile to the
      # host so every deploy runs the reviewed versions, then the host-side
      # script performs the candidate/cutover/rollback flow.
      - name: Deploy immutable image through Systems Manager
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
          IMAGE_TAG: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}-${{ github.sha }}
          REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
        run: >-
          bash scripts/deploy-to-host.sh
          "$INSTANCE_ID" "$ENVIRONMENT" "$IMAGE_TAG"
          "${AWS_REGION:-ap-south-1}" "$REPOSITORY_URL"
