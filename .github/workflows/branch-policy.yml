name: Branch policy

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  only-dev:
    # Production is promote-only: nothing reaches main except a merge-commit
    # PR carrying the already-staged contents of dev.
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require pull requests to main to come from dev
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::main only accepts merge PRs from the dev branch (got '$HEAD_REF')."
            exit 1
          fi

  named-work-branch:
    # Staging accepts only typed work branches. This is the naming convention's
    # teeth — the repo is on a plan without branch protection, so this check is
    # the enforcement. sync/* is reserved for main -> dev back-merges after
    # hotfixes land on production.
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Require pull requests to dev to use a typed work branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! echo "$HEAD_REF" | grep -qE '^(feature|fix|chore|hotfix|docs|sync)/.+'; then
            echo "::error::PRs to dev must come from a typed work branch — feature/, fix/, chore/, hotfix/, docs/, or sync/ (got '$HEAD_REF')."
            exit 1
          fi
