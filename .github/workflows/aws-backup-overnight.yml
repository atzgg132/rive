# Overnight AWS backup for Rive. Backup-only: no terminate/stop/delete of
# EC2/RDS, no DNS changes, no security-group 0.0.0.0/0, no migrate.
#
# Primary path: SSM on the app host using the EC2 instance profile
# (rive-app-instance) for RDS snapshots, pg_dump, and S3 PutObject.
# After a successful upload the host prints presigned_url=<https> (aws s3 presign,
# 7200s) so a box without AWS CLI can curl the tarball. The runner curls that
# URL into the artifact (best-effort). GitHub OIDC (rive-github-deploy) only
# sends the SSM command; runner-side RDS/S3 GetObject is expected to AccessDenied.
name: Overnight AWS backup

on:
  workflow_dispatch:
    inputs:
      create_rds_snapshot:
        description: Create a manual RDS snapshot for each available Postgres instance
        type: boolean
        default: true
      dump_via_ssm:
        description: Dump databases via SSM on the app host and archive them
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/triggers/run-aws-backup'
  schedule:
    - cron: '40 21 * * *'  # 03:10 IST — backup if push path somehow misses

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-backup-overnight
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    env:
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1
      BACKUP_STAMP: "2026-09-23"
      SNAPSHOT_PREFIX: rive-backup-manual-20260923-overnight
      DUMP_DIR_HOST: /tmp/aws-backup-2026-09-23
      BACKUP_BUCKET_NAME: rive-aws-backup-20260923
      # workflow_dispatch honors the boolean inputs. push and schedule always do both.
      DO_SNAPSHOT: ${{ github.event_name == 'workflow_dispatch' && inputs.create_rds_snapshot || (github.event_name != 'workflow_dispatch') }}
      DO_DUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.dump_via_ssm || (github.event_name != 'workflow_dispatch') }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Record caller identity
        id: sts
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/aws-backup-2026-09-23"
          echo "::notice::Backup-only. Primary path is SSM + instance profile. Never terminate/stop/delete EC2 or RDS."
          aws sts get-caller-identity | tee "${RUNNER_TEMP}/aws-backup-2026-09-23/caller-identity.json"
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          echo "account=${ACCOUNT}" >> "${GITHUB_OUTPUT}"

      - name: Best-effort runner RDS describe (GitHub role)
        id: rds_describe
        continue-on-error: true
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/aws-backup-2026-09-23"
          echo "Runner-side describe is best-effort; rive-github-deploy typically lacks rds:Describe*."
          set +e
          aws rds describe-db-instances --region ap-south-1 --output json \
            > "${OUT}/rds-instances.json" 2>"${OUT}/rds-describe.err"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "RDS instances (runner role):"
            jq -r '.DBInstances[] | [.DBInstanceIdentifier, .Engine, .EngineVersion, .DBInstanceStatus, .DBInstanceClass, .StorageEncrypted, .DBInstanceArn] | @tsv' \
              "${OUT}/rds-instances.json"
            echo "ok=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "::warning::Runner rds:DescribeDBInstances failed (expected if deploy role has no RDS)."
          cat "${OUT}/rds-describe.err" || true
          echo "ok=false" >> "${GITHUB_OUTPUT}"
          exit 1

      - name: Best-effort runner RDS snapshot (GitHub role)
        id: rds_snapshot
        if: ${{ env.DO_SNAPSHOT == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/aws-backup-2026-09-23"
          : > "${OUT}/runner-snapshots.txt"
          echo "Runner-side snapshot is best-effort; primary create is SSM + instance profile."
          if [ ! -s "${OUT}/rds-instances.json" ]; then
            echo "::warning::No runner RDS describe output; skipping GitHub-role snapshot (SSM host will try)."
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

          mapfile -t ROWS < <(jq -r '
            .DBInstances[]
            | select((.Engine == "postgres" or .Engine == "aurora-postgresql") and .DBInstanceStatus == "available")
            | .DBInstanceIdentifier
          ' "${OUT}/rds-instances.json")

          if [ "${#ROWS[@]}" -eq 0 ]; then
            echo "::warning::Runner saw no available Postgres instances."
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

          created=0
          for dbid in "${ROWS[@]}"; do
            arn=""
            safe="$(printf '%s' "$dbid" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-//; s/-$//')"
            snap="${SNAPSHOT_PREFIX}-${safe}"
            snap="$(printf '%s' "$snap" | cut -c1-63 | sed 's/-$//')"
            echo "Runner create-db-snapshot ${snap} for ${dbid} (never deleting)"
            set +e
            create_out="$(aws rds create-db-snapshot \
              --region ap-south-1 \
              --db-instance-identifier "$dbid" \
              --db-snapshot-identifier "$snap" \
              --output json 2>"${OUT}/snapshot-${safe}.err")"
            create_rc=$?
            set -e
            if [ "$create_rc" -ne 0 ]; then
              echo "::warning::Runner create-db-snapshot failed for ${dbid} (likely missing rds:CreateDBSnapshot on rive-github-deploy)."
              cat "${OUT}/snapshot-${safe}.err" || true
              continue
            fi
            arn="$(printf '%s' "$create_out" | jq -r '.DBSnapshot.DBSnapshotArn // empty')"
            printf '%s\t%s\t%s\n' "$snap" "$arn" "creating" | tee -a "${OUT}/runner-snapshots.txt"
            if [ -n "$arn" ] && [ "$arn" != "null" ]; then
              created=$((created + 1))
            fi
          done

          if [ "$created" -gt 0 ]; then
            echo "created=true" >> "${GITHUB_OUTPUT}"
            echo "count=${created}" >> "${GITHUB_OUTPUT}"
          else
            echo "created=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

      - name: Best-effort runner S3 discover (GitHub role)
        id: s3
        continue-on-error: true
        env:
          ACCOUNT: ${{ steps.sts.outputs.account }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/aws-backup-2026-09-23"
          CHOSEN=""
          echo "Runner-side S3 is best-effort; host instance profile does the real upload."

          is_fully_blocked() {
            local bucket="$1"
            local pab
            pab="$(aws s3api get-public-access-block --bucket "$bucket" --output json 2>/dev/null || true)"
            if [ -z "$pab" ]; then
              return 1
            fi
            echo "$pab" | jq -e '
              .PublicAccessBlockConfiguration.BlockPublicAcls == true
              and .PublicAccessBlockConfiguration.IgnorePublicAcls == true
              and .PublicAccessBlockConfiguration.BlockPublicPolicy == true
              and .PublicAccessBlockConfiguration.RestrictPublicBuckets == true
            ' >/dev/null
          }

          consider() {
            local bucket="$1"
            local known="${2:-}"
            if [ -z "$bucket" ] || [ -n "$CHOSEN" ]; then
              return 0
            fi
            if aws s3api head-bucket --bucket "$bucket" 2>/dev/null; then
              if is_fully_blocked "$bucket"; then
                CHOSEN="$bucket"
                echo "Runner sees private bucket s3://${bucket}"
              elif [ "$known" = "known" ]; then
                echo "Runner sees known rive bucket s3://${bucket} (could not re-verify Block Public Access)"
                CHOSEN="$bucket"
              else
                echo "Skipping s3://${bucket}: Block Public Access is not fully ON."
              fi
            fi
          }

          consider "$BACKUP_BUCKET_NAME" known
          consider "rive-prod-assets-${ACCOUNT}" known
          consider "rive-dev-assets-${ACCOUNT}" known

          set +e
          aws s3api list-buckets --query 'Buckets[].Name' --output text >/dev/null 2>"${OUT}/s3-list.err"
          list_rc=$?
          set -e
          if [ "$list_rc" -ne 0 ]; then
            echo "Runner list-buckets denied (expected). Host will use known asset bucket names."
            cat "${OUT}/s3-list.err" || true
          fi

          FALLBACK="rive-prod-assets-${ACCOUNT}"
          echo "bucket=${CHOSEN}" >> "${GITHUB_OUTPUT}"
          echo "fallback=${FALLBACK}" >> "${GITHUB_OUTPUT}"
          echo "Runner S3 hint bucket='${CHOSEN:-}' fallback='${FALLBACK}'" | tee "${OUT}/s3-target.txt"

      - name: SSM host backup (primary — instance profile)
        id: ssm
        if: ${{ env.DO_SNAPSHOT == 'true' || env.DO_DUMP == 'true' }}
        continue-on-error: true
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          BACKUP_BUCKET: ${{ steps.s3.outputs.bucket }}
          FALLBACK_BUCKET: ${{ steps.s3.outputs.fallback }}
          CREATE_SNAPSHOT_IN: ${{ env.DO_SNAPSHOT }}
          DO_DUMP_IN: ${{ env.DO_DUMP }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/aws-backup-2026-09-23"
          if [ -z "${INSTANCE_ID}" ]; then
            echo "::error::vars.AWS_INSTANCE_ID is empty (production environment required)."
            echo "ok=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

          sanitize_bucket() {
            local b="${1:-}"
            if [[ "$b" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
              printf '%s' "$b"
            fi
          }
          flag() {
            if [ "${1:-}" = "true" ]; then printf 'true'; else printf 'false'; fi
          }
          BUCKET="$(sanitize_bucket "${BACKUP_BUCKET:-}")"
          FALLBACK="$(sanitize_bucket "${FALLBACK_BUCKET:-}")"
          CREATE_SNAPSHOT="$(flag "${CREATE_SNAPSHOT_IN:-}")"
          DO_DUMP="$(flag "${DO_DUMP_IN:-}")"

          HOST_SCRIPT_FILE="${OUT}/host-backup.sh"
          cat > "$HOST_SCRIPT_FILE" <<'HOST'
          set -euo pipefail
          umask 077
          BACKUP_BUCKET='@@BACKUP_BUCKET@@'
          FALLBACK_BUCKET='@@FALLBACK_BUCKET@@'
          CREATE_SNAPSHOT='@@CREATE_SNAPSHOT@@'
          DO_DUMP='@@DO_DUMP@@'
          SNAPSHOT_PREFIX=rive-backup-manual-20260923-overnight
          DUMP_DIR=/tmp/aws-backup-2026-09-23
          mkdir -p "$DUMP_DIR"
          chmod 700 "$DUMP_DIR"
          : > "${DUMP_DIR}/snapshots.txt"
          host_snapshot_created=false
          host_dump_ok=false
          instance_rds_denied=false
          instance_s3_denied=false
          UPLOADED=""

          echo "=== instance profile identity ==="
          aws sts get-caller-identity --query Arn --output text || true
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text 2>/dev/null || true)"

          snapshot_one() {
            local dbid="$1"
            local safe snap
            safe="$(printf '%s' "$dbid" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-//; s/-$//')"
            snap="${SNAPSHOT_PREFIX}-${safe}"
            snap="$(printf '%s' "$snap" | cut -c1-63 | sed 's/-$//')"
            echo "instance-profile create-db-snapshot ${snap} for ${dbid} (never deleting)"
            if aws rds create-db-snapshot \
              --region ap-south-1 \
              --db-instance-identifier "$dbid" \
              --db-snapshot-identifier "$snap" \
              --output json >"${DUMP_DIR}/snap-${safe}.json" 2>"${DUMP_DIR}/snap-${safe}.err"; then
              python3 - "${DUMP_DIR}/snap-${safe}.json" <<'PY' || true
          import json, sys
          d = json.load(open(sys.argv[1]))
          s = d.get("DBSnapshot") or d
          print("host_snapshot_arn=%s" % s.get("DBSnapshotArn", ""))
          print("host_snapshot_id=%s" % s.get("DBSnapshotIdentifier", ""))
          PY
              echo "${snap}	created" >> "${DUMP_DIR}/snapshots.txt"
              host_snapshot_created=true
              return 0
            fi
            if grep -qi 'DBSnapshotAlreadyExists' "${DUMP_DIR}/snap-${safe}.err"; then
              echo "snapshot ${snap} already exists (not deleting)"
              echo "${snap}	already-exists" >> "${DUMP_DIR}/snapshots.txt"
              host_snapshot_created=true
              return 0
            fi
            echo "create-db-snapshot failed for ${dbid}"
            cat "${DUMP_DIR}/snap-${safe}.err" || true
            if grep -qiE 'AccessDenied|UnauthorizedOperation|not authorized' "${DUMP_DIR}/snap-${safe}.err"; then
              instance_rds_denied=true
            fi
            return 1
          }

          if [ "$CREATE_SNAPSHOT" = "true" ]; then
            echo "=== RDS snapshots via instance profile ==="
            ids=""
            if aws rds describe-db-instances --region ap-south-1 --output json >"${DUMP_DIR}/rds-instances.json" 2>"${DUMP_DIR}/rds-describe.err"; then
              ids="$(python3 - "${DUMP_DIR}/rds-instances.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          ids = []
          for db in data.get("DBInstances", []):
              ident = db.get("DBInstanceIdentifier") or ""
              eng = db.get("Engine") or ""
              st = db.get("DBInstanceStatus") or ""
              print("%s %s %s" % (ident, eng, st), file=sys.stderr)
              if st == "available" and eng in ("postgres", "aurora-postgresql") and ident:
                  ids.append(ident)
          if "rive-postgres" not in ids:
              ids.insert(0, "rive-postgres")
          else:
              ids = ["rive-postgres"] + [i for i in ids if i != "rive-postgres"]
          print("\n".join(ids))
          PY
          )" || ids="rive-postgres"
            else
              echo "instance describe-db-instances failed; will still try rive-postgres"
              cat "${DUMP_DIR}/rds-describe.err" || true
              if grep -qiE 'AccessDenied|UnauthorizedOperation|not authorized' "${DUMP_DIR}/rds-describe.err"; then
                instance_rds_denied=true
              fi
              ids="rive-postgres"
            fi
            snap_ok=0
            while IFS= read -r dbid; do
              [ -z "$dbid" ] && continue
              if snapshot_one "$dbid"; then
                snap_ok=1
              fi
            done <<EOF
          $ids
          EOF
            if [ "$snap_ok" -eq 1 ]; then
              host_snapshot_created=true
            fi
            echo "host_snapshot_created=${host_snapshot_created}"
            echo "instance_rds_denied=${instance_rds_denied}"
          fi

          echo "=== docker ps ==="
          docker ps --format '{{.ID}} {{.Names}} {{.Image}}' || true
          echo "=== mise/minervaa containers ==="
          docker ps --format '{{.ID}} {{.Names}} {{.Image}}' | grep -iE 'mise|minervaa|minerva' || echo "(none)"

          get_env() {
            local ctn="$1" key="$2"
            docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$ctn" 2>/dev/null \
              | awk -F= -v k="$key" '$1==k { print substr($0, index($0,"=")+1) }' \
              | tail -n1
          }

          skip_name() {
            printf '%s' "$1" | grep -qiE 'proxy|caddy|candidate|previous|migrate|buildx|aws-backup-pgdump'
          }

          ensure_pg_client() {
            if docker image inspect postgres:17-alpine >/dev/null 2>&1; then
              return 0
            fi
            echo "Pulling postgres:17-alpine for pg_dump (ARM64 host)"
            # --quiet keeps docker progress off stdout. SSM returns only the first
            # 24KB of StandardOutputContent; a verbose pull would clip presigned_url=.
            docker pull --quiet postgres:17-alpine || return 1
          }

          dump_url_to() {
            local dest="$1"
            if [ -z "${DATABASE_URL:-}" ]; then
              echo "skip ${dest}: no DATABASE_URL in env (not printing values)"
              return 0
            fi
            echo "pg_dump -Fc -> ${DUMP_DIR}/${dest} (credentials redacted)"
            if ! ensure_pg_client; then
              echo "pg_dump client unavailable for ${dest}"
              unset DATABASE_URL
              return 0
            fi
            docker run --rm --network host \
              --name "aws-backup-pgdump-$$" \
              -e DATABASE_URL \
              -v "${DUMP_DIR}:/backup" \
              postgres:17-alpine \
              pg_dump -Fc -d "$DATABASE_URL" -f "/backup/${dest}" \
              || echo "pg_dump failed for ${dest} (container/host unchanged; not printing connection)"
            unset DATABASE_URL
            return 0
          }

          dump_container_url() {
            local ctn="$1" dest="$2"
            if ! docker inspect "$ctn" >/dev/null 2>&1; then
              echo "container ${ctn} not present"
              return 0
            fi
            DATABASE_URL="$(get_env "$ctn" DATABASE_URL)"
            dump_url_to "$dest"
          }

          if [ "$DO_DUMP" = "true" ]; then
            echo "=== preferred rive app dumps ==="
            dump_container_url rive-prod rive_prod.dump
            dump_container_url rive-dev rive_dev.dump

            if [ ! -s "${DUMP_DIR}/rive_prod.dump" ] && [ -f /opt/rive/env/prod.env ]; then
              DATABASE_URL="$(awk -F= '$1=="DATABASE_URL" { print substr($0, index($0,"=")+1) }' /opt/rive/env/prod.env | tail -n1)"
              dump_url_to rive_prod.dump
            fi
            if [ ! -s "${DUMP_DIR}/rive_dev.dump" ] && [ -f /opt/rive/env/dev.env ]; then
              DATABASE_URL="$(awk -F= '$1=="DATABASE_URL" { print substr($0, index($0,"=")+1) }' /opt/rive/env/dev.env | tail -n1)"
              dump_url_to rive_dev.dump
            fi

            echo "=== postgres/mysql container dumps ==="
            docker ps --format '{{.ID}}\t{{.Names}}\t{{.Image}}' | while IFS=$'\t' read -r cid cname cimage; do
              if skip_name "$cname"; then
                continue
              fi
              low="$(printf '%s %s' "$cname" "$cimage" | tr '[:upper:]' '[:lower:]')"
              case "$low" in
                *postgres*|*postgis*)
                  dest="postgres-${cname}.dump"
                  dest="$(printf '%s' "$dest" | tr -c 'A-Za-z0-9._-' '-' )"
                  echo "docker exec pg_dump for ${cname} -> ${dest}"
                  if ! timeout 180 docker exec "$cid" sh -c 'pg_dumpall --no-password -U "${POSTGRES_USER:-postgres}"' \
                    > "${DUMP_DIR}/${dest}"; then
                    echo "postgres dump of ${cname} failed or timed out (container kept)"
                    rm -f "${DUMP_DIR}/${dest}"
                  fi
                  ;;
                *mysql*|*mariadb*)
                  dest="mysql-${cname}.sql.gz"
                  dest="$(printf '%s' "$dest" | tr -c 'A-Za-z0-9._-' '-' )"
                  echo "docker exec mysqldump for ${cname} -> ${dest}"
                  if ! timeout 180 docker exec "$cid" sh -c 'mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --all-databases --single-transaction --quick' \
                    | gzip -c > "${DUMP_DIR}/${dest}"; then
                    echo "mysql dump of ${cname} failed or timed out (container kept)"
                    rm -f "${DUMP_DIR}/${dest}"
                  fi
                  ;;
              esac
            done

            echo "=== minervaa / mise dumps ==="
            docker ps --format '{{.ID}}\t{{.Names}}\t{{.Image}}' | while IFS=$'\t' read -r cid cname cimage; do
              if ! printf '%s %s' "$cname" "$cimage" | grep -qiE 'mise|minervaa|minerva'; then
                continue
              fi
              dest="minervaa-${cname}.dump"
              dest="$(printf '%s' "$dest" | tr -c 'A-Za-z0-9._-' '-' )"
              DATABASE_URL="$(get_env "$cid" DATABASE_URL)"
              if [ -z "${DATABASE_URL:-}" ]; then
                DATABASE_URL="$(get_env "$cid" POSTGRES_URL)"
              fi
              if [ -n "${DATABASE_URL:-}" ]; then
                dump_url_to "$dest"
              else
                echo "listed ${cname} (${cimage}); no DATABASE_URL to dump"
              fi
            done

            echo "=== dump directory ==="
            ls -la "$DUMP_DIR" || true
            if ls "${DUMP_DIR}"/*.dump >/dev/null 2>&1 || ls "${DUMP_DIR}"/*.sql.gz >/dev/null 2>&1; then
              host_dump_ok=true
            fi
            tar -C /tmp -czf /tmp/aws-backup-2026-09-23.tar.gz aws-backup-2026-09-23
            chmod 600 /tmp/aws-backup-2026-09-23.tar.gz
            echo "tarball=$(wc -c < /tmp/aws-backup-2026-09-23.tar.gz) bytes"
            echo "host_dump_ok=${host_dump_ok}"
          fi

          upload_to() {
            local bucket="$1"
            if [ -z "$bucket" ] || [ ! -f /tmp/aws-backup-2026-09-23.tar.gz ]; then
              return 1
            fi
            echo "aws s3 cp tarball -> s3://${bucket}/aws-backup-2026-09-23/rive-overnight.tar.gz"
            aws s3 cp /tmp/aws-backup-2026-09-23.tar.gz \
              "s3://${bucket}/aws-backup-2026-09-23/rive-overnight.tar.gz" \
              --sse AES256 --only-show-errors
          }

          if [ "$DO_DUMP" = "true" ] && [ -f /tmp/aws-backup-2026-09-23.tar.gz ]; then
            echo "=== S3 upload via instance profile ==="
            for candidate in \
              "rive-prod-assets-${ACCOUNT}" \
              "rive-dev-assets-${ACCOUNT}" \
              "$BACKUP_BUCKET" \
              "$FALLBACK_BUCKET" \
              "rive-aws-backup-20260923"; do
              if [ -z "$candidate" ] || [ "$candidate" = "$UPLOADED" ]; then
                continue
              fi
              if upload_to "$candidate"; then
                UPLOADED="$candidate"
                echo "uploaded_bucket=${UPLOADED}"
                break
              fi
              echo "upload to s3://${candidate} failed"
            done
            if [ -z "$UPLOADED" ]; then
              echo "Trying to create private bucket rive-aws-backup-20260923 (instance role may lack s3:CreateBucket)"
              if aws s3api create-bucket \
                --bucket rive-aws-backup-20260923 \
                --region ap-south-1 \
                --create-bucket-configuration LocationConstraint=ap-south-1 \
                2>"${DUMP_DIR}/s3-create.err"; then
                aws s3api put-public-access-block \
                  --bucket rive-aws-backup-20260923 \
                  --public-access-block-configuration \
                  BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true \
                  || true
                if upload_to rive-aws-backup-20260923; then
                  UPLOADED=rive-aws-backup-20260923
                  echo "uploaded_bucket=${UPLOADED}"
                fi
              else
                cat "${DUMP_DIR}/s3-create.err" || true
                if grep -qiE 'AccessDenied|UnauthorizedOperation|not authorized' "${DUMP_DIR}/s3-create.err"; then
                  instance_s3_denied=true
                fi
              fi
            fi
            if [ -z "$UPLOADED" ]; then
              instance_s3_denied=true
              echo "No S3 upload from host. Dumps remain at ${DUMP_DIR} and /tmp/aws-backup-2026-09-23.tar.gz"
            fi
            if [ -n "$UPLOADED" ]; then
              echo "=== presigned GET via instance profile (7200s) ==="
              PRESIGN="$(aws s3 presign "s3://${UPLOADED}/aws-backup-2026-09-23/rive-overnight.tar.gz" --expires-in 7200)" || PRESIGN=""
              if [ -n "$PRESIGN" ]; then
                printf 'presigned_url=%s\n' "$PRESIGN"
              else
                echo "aws s3 presign failed; object remains at s3://${UPLOADED}/aws-backup-2026-09-23/rive-overnight.tar.gz"
              fi
            fi
            echo "instance_s3_denied=${instance_s3_denied}"
          fi

          echo "host_snapshot_created=${host_snapshot_created}"
          echo "host_dump_ok=${host_dump_ok}"
          echo "instance_rds_denied=${instance_rds_denied}"
          echo "instance_s3_denied=${instance_s3_denied}"
          exit 0
          HOST

          python3 - "$HOST_SCRIPT_FILE" "$BUCKET" "$FALLBACK" "$CREATE_SNAPSHOT" "$DO_DUMP" "${OUT}/ssm-params.json" <<'PY'
          import json, sys
          path, bucket, fallback, create_snap, do_dump, dest = sys.argv[1:7]
          script = open(path, encoding="utf-8").read()
          script = (
              script.replace("@@BACKUP_BUCKET@@", bucket or "")
              .replace("@@FALLBACK_BUCKET@@", fallback or "")
              .replace("@@CREATE_SNAPSHOT@@", create_snap)
              .replace("@@DO_DUMP@@", do_dump)
          )
          json.dump({"commands": [script]}, open(dest, "w", encoding="utf-8"))
          PY

          COMMAND_ID="$(aws ssm send-command \
            --region ap-south-1 \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 3600 \
            --comment "rive overnight backup via instance profile (non-destructive)" \
            --parameters "file://${OUT}/ssm-params.json" \
            --query 'Command.CommandId' \
            --output text)"
          echo "SSM command ${COMMAND_ID} dispatched (primary backup path)"
          echo "command_id=${COMMAND_ID}" >> "${GITHUB_OUTPUT}"

          status="Pending"
          for _ in $(seq 1 140); do
            inv="$(aws ssm get-command-invocation \
              --region ap-south-1 \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>/dev/null || true)"
            if [ -n "$inv" ]; then
              status="$(printf '%s' "$inv" | jq -r '.Status')"
              echo "SSM status=${status}"
              case "$status" in
                Success|Failed|Cancelled|TimedOut) break ;;
              esac
            fi
            sleep 15
          done

          aws ssm get-command-invocation \
            --region ap-south-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json | tee "${OUT}/ssm-invocation.json" >/dev/null
          jq -r '.Output // empty' "${OUT}/ssm-invocation.json"
          jq -r '.Error // empty' "${OUT}/ssm-invocation.json" >&2 || true

          outtxt="$(jq -r '.Output // empty' "${OUT}/ssm-invocation.json")"
          parse() { printf '%s\n' "$outtxt" | awk -F= -v k="$1" '$1==k{print $2}' | tail -n1; }
          echo "uploaded_bucket=$(parse uploaded_bucket)" >> "${GITHUB_OUTPUT}"
          echo "host_snapshot_created=$(parse host_snapshot_created)" >> "${GITHUB_OUTPUT}"
          echo "host_dump_ok=$(parse host_dump_ok)" >> "${GITHUB_OUTPUT}"
          echo "instance_rds_denied=$(parse instance_rds_denied)" >> "${GITHUB_OUTPUT}"
          echo "instance_s3_denied=$(parse instance_s3_denied)" >> "${GITHUB_OUTPUT}"
          # Query string contains '='. Keep everything after the first '='.
          presign_url="$(printf '%s\n' "$outtxt" | tr -d '\r' | sed -n 's/^presigned_url=//p' | tail -n1)"
          printf 'presigned_url=%s\n' "$presign_url" >> "${GITHUB_OUTPUT}"

          if [ "$status" != "Success" ]; then
            echo "::warning::SSM host backup ended with status=${status}"
            echo "ok=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
          echo "ok=true" >> "${GITHUB_OUTPUT}"

      - name: Best-effort copy dumps from S3 to the runner
        id: pull
        if: ${{ env.DO_DUMP == 'true' }}
        continue-on-error: true
        env:
          UPLOADED_BUCKET: ${{ steps.ssm.outputs.uploaded_bucket }}
          SELECTED_BUCKET: ${{ steps.s3.outputs.bucket }}
          FALLBACK_BUCKET: ${{ steps.s3.outputs.fallback }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/aws-backup-2026-09-23"
          KEY="aws-backup-2026-09-23/rive-overnight.tar.gz"
          pulled=0
          echo "Runner s3 cp is best-effort; rive-github-deploy typically has no s3:GetObject."
          for bucket in ${UPLOADED_BUCKET:-} ${SELECTED_BUCKET:-} ${FALLBACK_BUCKET:-}; do
            if [ -z "$bucket" ]; then
              continue
            fi
            echo "Attempting aws s3 cp s3://${bucket}/${KEY}"
            if aws s3 cp "s3://${bucket}/${KEY}" "${OUT}/rive-overnight.tar.gz" --only-show-errors; then
              mkdir -p "${OUT}/dumps"
              tar -tzf "${OUT}/rive-overnight.tar.gz" >/dev/null
              tar -xzf "${OUT}/rive-overnight.tar.gz" -C "${OUT}/dumps" --strip-components=1 || tar -xzf "${OUT}/rive-overnight.tar.gz" -C "${OUT}/dumps"
              echo "pulled=true" >> "${GITHUB_OUTPUT}"
              pulled=1
              break
            fi
          done
          if [ "$pulled" -eq 0 ]; then
            echo "Could not copy dumps to the runner. Host/S3 copies may still exist."
            echo "pulled=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

      - name: Best-effort curl presigned tarball
        id: presign_pull
        if: ${{ env.DO_DUMP == 'true' && steps.ssm.outputs.ok == 'true' }}
        continue-on-error: true
        env:
          PRESIGNED_URL: ${{ steps.ssm.outputs.presigned_url }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/aws-backup-2026-09-23"
          url="${PRESIGNED_URL:-}"
          if [ -z "$url" ] && [ -f "${OUT}/ssm-invocation.json" ]; then
            url="$(jq -r '.Output // empty' "${OUT}/ssm-invocation.json" | tr -d '\r' | sed -n 's/^presigned_url=//p' | tail -n1)"
          fi
          if [ -z "$url" ]; then
            echo "::warning::No presigned_url in SSM output. Host stdout should contain presigned_url=https://..."
            echo "curled=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
          case "$url" in
            https://*) ;;
            *)
              echo "::warning::presigned_url is not an https URL; not curling."
              echo "curled=false" >> "${GITHUB_OUTPUT}"
              exit 1
              ;;
          esac
          echo "Curling presigned GET (from host presigned_url= line) into ${OUT}/rive-overnight.tar.gz"
          if ! curl -fsSL --retry 3 --retry-delay 2 --max-time 180 -o "${OUT}/rive-overnight.tar.gz" "$url"; then
            echo "::warning::curl of presigned URL failed (best-effort). The URL is still in the SSM step log."
            rm -f "${OUT}/rive-overnight.tar.gz"
            echo "curled=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
          if ! tar -tzf "${OUT}/rive-overnight.tar.gz" >/dev/null; then
            echo "::warning::Downloaded object is not a readable tar.gz; not uploading it as the tarball."
            rm -f "${OUT}/rive-overnight.tar.gz"
            echo "curled=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi
          bytes="$(wc -c < "${OUT}/rive-overnight.tar.gz" | tr -d ' ')"
          echo "Presigned curl ok (${bytes} bytes)."
          echo "curled=true" >> "${GITHUB_OUTPUT}"
          echo "bytes=${bytes}" >> "${GITHUB_OUTPUT}"

      - name: Upload backup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rive-aws-backup-2026-09-23
          path: |
            ${{ runner.temp }}/aws-backup-2026-09-23/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload real tarball artifact
        if: ${{ steps.presign_pull.outputs.curled == 'true' || steps.pull.outputs.pulled == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rive-overnight-tarball-2026-09-23
          path: ${{ runner.temp }}/aws-backup-2026-09-23/rive-overnight.tar.gz
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize backup
        if: always()
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/aws-backup-2026-09-23"
          {
            echo "## Overnight AWS backup"
            echo
            echo "Primary path: SSM + EC2 instance profile. Runner RDS/S3 is best-effort."
            echo
            echo "- Region: ap-south-1"
            echo "- GitHub caller: \`$(jq -r .Arn "${OUT}/caller-identity.json" 2>/dev/null || echo unknown)\`"
            echo "- Runner RDS describe: ${{ steps.rds_describe.outcome }}"
            echo "- Runner RDS snapshot: ${{ steps.rds_snapshot.outcome }} (created=${{ steps.rds_snapshot.outputs.created }})"
            echo "- SSM host backup: ${{ steps.ssm.outcome }} (ok=${{ steps.ssm.outputs.ok }})"
            echo "- Host snapshot created: ${{ steps.ssm.outputs.host_snapshot_created }}"
            echo "- Host dump ok: ${{ steps.ssm.outputs.host_dump_ok }}"
            echo "- Host uploaded_bucket: ${{ steps.ssm.outputs.uploaded_bucket }}"
            echo "- Instance RDS denied: ${{ steps.ssm.outputs.instance_rds_denied }}"
            echo "- Instance S3 denied: ${{ steps.ssm.outputs.instance_s3_denied }}"
            echo "- Runner S3 pull: ${{ steps.pull.outcome }}"
            echo "- Presigned curl: ${{ steps.presign_pull.outcome }} (curled=${{ steps.presign_pull.outputs.curled }}, bytes=${{ steps.presign_pull.outputs.bytes }})"
            echo "- presigned_url= is printed in the SSM host stdout (2h GET). Do not treat a missing GitHub artifact as a missing object."
            echo
            echo "### Host snapshots"
            echo '```'
            jq -r '.Output // empty' "${OUT}/ssm-invocation.json" 2>/dev/null | grep -E 'host_snapshot_|create-db-snapshot|already exists' || echo "(see SSM output)"
            echo '```'
            echo
            echo "### IAM"
            echo "- \`rive-github-deploy\` is ECR + SSM SendCommand only. Runner RDS/S3 AccessDenied is expected."
            echo "- Snapshots/S3 from the host use \`rive-app-instance\`. If \`instance_rds_denied=true\`, add backup-scoped \`rds:DescribeDBInstances\`, \`rds:CreateDBSnapshot\`, \`rds:DescribeDBSnapshots\` (no Delete*)."
            echo "- If S3 upload failed, instance role already has PutObject on \`rive-*-assets-<account>\`; dedicated bucket create needs \`s3:CreateBucket\` + Block Public Access. Dumps may still be on the host at \`/tmp/aws-backup-2026-09-23\`."
            echo
            echo "Nothing in this run terminates, stops, or deletes EC2/RDS, opens security groups, changes DNS, or runs migrations."
          } | tee -a "${GITHUB_STEP_SUMMARY}"

          snap_ok=0
          dump_ok=0
          any=0
          if [ "${{ steps.ssm.outputs.host_snapshot_created }}" = "true" ] || [ "${{ steps.rds_snapshot.outputs.created }}" = "true" ]; then
            snap_ok=1
          fi
          if [ "${{ steps.ssm.outputs.host_dump_ok }}" = "true" ]; then
            dump_ok=1
          fi
          if [ "$DO_SNAPSHOT" = "true" ] && [ "$snap_ok" -eq 1 ]; then
            any=1
          fi
          if [ "$DO_DUMP" = "true" ] && [ "$dump_ok" -eq 1 ]; then
            any=1
          fi
          if [ "$DO_SNAPSHOT" != "true" ] && [ "$DO_DUMP" != "true" ]; then
            any=1
          fi

          if [ "$any" -eq 1 ]; then
            echo "Backup produced at least one requested artifact/snapshot (or nothing was requested)."
            if [ "$DO_SNAPSHOT" = "true" ] && [ "$snap_ok" -eq 0 ]; then
              echo "::warning::Host RDS snapshot did not confirm success. Instance role likely needs rds:CreateDBSnapshot and rds:DescribeDBInstances on rive-app-instance (no Delete*)."
            fi
            if [ "$DO_DUMP" = "true" ] && [ "$dump_ok" -eq 0 ]; then
              echo "::warning::SSM dump path did not confirm a dump file."
            fi
            if [ "${{ steps.ssm.outputs.instance_rds_denied }}" = "true" ]; then
              echo "::warning::Instance profile AccessDenied on RDS. Add backup-scoped rds:DescribeDBInstances + rds:CreateDBSnapshot to rive-app-instance (no delete)."
            fi
            if [ "${{ steps.ssm.outputs.instance_s3_denied }}" = "true" ]; then
              echo "::warning::Instance profile could not upload to S3. PutObject on rive-*-assets-<account> should work; CreateBucket for rive-aws-backup-20260923 is extra. Dumps may remain on the host."
            fi
            exit 0
          fi
          echo "::error::Requested backup paths failed."
          exit 1
