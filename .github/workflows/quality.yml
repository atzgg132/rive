name: Quality

# Runs once per pull request (not again for the branch push — that doubled
# every run for the same code). Push a branch and open its PR to get checks;
# workflow_dispatch runs the suite on any branch without a PR.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
