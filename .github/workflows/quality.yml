name: Quality

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - test
      - dev

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rive
          POSTGRES_PASSWORD: rive
          POSTGRES_DB: rive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rive -d rive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rive:rive@localhost:5432/rive_test
      DATABASE_SSL: disable
      SESSION_SECRET: ci-session-secret
      CALENDAR_ENCRYPTION_KEY: ci-calendar-encryption-key
      CRON_SECRET: ci-cron-secret
      APP_URL: http://127.0.0.1:3000
      APP_ENV: test
      EMAIL_PROVIDER: ses
      AWS_REGION: ap-south-1
      ESIGN_PROVIDER: local
      CONTRACTS_ALLOW_LOCAL_PROVIDER_IN_PRODUCTION: "true"
      CONTRACTS_RECORDED_ACCEPTANCE_ENABLED: "true"
      E2E_USER_EMAIL: e2e-workspace@rive.test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: node scripts/seed-e2e-user.mjs
      - run: npm run test:unit
      - run: npx tsc --noEmit --incremental false
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run E2E tests
        env:
          PLAYWRIGHT_SERVER: production
          PLAYWRIGHT_WORKERS: 4
        run: npm run test:e2e
      - run: npm audit --omit=dev
